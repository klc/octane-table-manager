name: tests

on:
  push:
  pull_request:

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pint --test

  # The built UI is committed; fail when it does not match the sources.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -z "$(git status --porcelain -- public)" || { git status --short -- public; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: [10, 11, 12, 13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: sh tests/e2e/run.sh ${{ matrix.laravel }}
